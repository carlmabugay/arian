services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: arian-app-dev
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mysql-dev
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata-dev:/var/lib/mysql

volumes:
  dbdata-dev:
