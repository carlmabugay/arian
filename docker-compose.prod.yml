services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arian-app-prod
    env_file:
      - .env
    volumes:
      - app-public:/var/www/public
      - ./:/var/www
    restart: unless-stopped
    ports:
      - "9000:9000"

  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/public
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mysql-prod
    env_file:
      - .env
    volumes:
      - dbdata-prod:/var/lib/mysql
    restart: unless-stopped

volumes:
  app-public:
  dbdata-prod:
